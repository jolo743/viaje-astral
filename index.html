<!DOCTYPE html>  <!-- Le dice al navegador que esto es HTML5 -->
<html lang="es">  <!-- Empieza la página, lang="es" indica que está en español -->

<head>
    <!-- El head no se ve en la página, pero configura cosas importantes -->

    <!-- Permite usar tildes y caracteres especiales como ñ -->
    <meta charset="UTF-8">

    <!-- Hace que la página se vea bien en móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>WeedWorld</title>

    <!-- Carga las fuentes desde Google Fonts: Orbitron (espacial) y Raleway (texto normal) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Raleway&display=swap">

    <!-- Carga nuestro archivo de estilos CSS -->
    <link rel="stylesheet" href="src/style.css">
</head>

<body>

    <!-- ── ENCABEZADO ── -->
    <!-- header agrupa todo lo que va en la parte superior: logo y navegación -->
    <header>

        <!-- nav contiene los enlaces de navegación principales -->
        <nav>

            <!-- Logo: <a> para que sea un enlace que lleva al inicio -->
            <a href="#" class="nav-logo">WeedWorld</a>

            <!-- Lista de enlaces del menú -->
            <!-- ul = lista, li = cada elemento, a = enlace -->
            <!-- El # en href significa que de momento no lleva a ningún sitio -->
            <ul class="nav-links">
                <li><a href="#">MacroFungi</a></li>
                <li><a href="#">Planeta Verde</a></li>
                <li><a href="#">Ether Líquido</a></li>
                <li><a href="#">Luz Prismática</a></li>
                <li><a href="#">Hiperespacio</a></li>
            </ul>

        </nav>

    </header>

    <!-- ── CONTENIDO PRINCIPAL ── -->
    <!-- main contiene el contenido principal de la página, solo se usa una vez -->
    <main>

        <!-- ── HERO ── -->
        <!-- section agrupa contenido relacionado: aquí la sección de bienvenida -->
        <section class="hero">

            <!-- Título principal, el texto más grande de la página -->
            <h1 class="hero-titulo">Viaja más allá de tu mente</h1>

            <!-- Subtítulo, un texto más pequeño debajo del título -->
            <p class="hero-subtitulo">Explora dimensiones que nunca imaginaste</p>

            <!-- Botón de llamada a la acción -->
            <a href="#" class="hero-boton">Empieza tu viaje</a>

        </section>

    </main>

</body>
</html>
